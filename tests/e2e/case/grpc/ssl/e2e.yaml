# gRPC one-way TLS against real OAP.

setup:
  env: compose
  file: docker-compose.grpc.ssl.yaml
  timeout: 20m
  init-system-environment: ../../../script/env
  steps:
    - name: set PATH
      command: export PATH=/usr/local/bin:/tmp/skywalking-infra-e2e/bin:$PATH
    - name: install yq
      command: bash tests/e2e/script/prepare/install.sh yq
    - name: install swctl
      command: bash tests/e2e/script/prepare/install.sh swctl

trigger:
  action: http
  # Continuous traffic so metrics have ongoing load.
  interval: 3s
  times: -1
  url: http://${consumer_host}:${consumer_9090}/artist-consumer
  method: POST
  headers:
    "Content-Type": "application/json"
  body: '{"song": "Despacito"}'

verify:
  retry:
    count: 20
    interval: 10s
  cases:
    # Full signal packs (grpc/single) plus tls-depth extras.
    - includes:
        - ../../logging-cases.yaml
        - ../../metadata-cases.yaml
        - ../../tls-depth-cases.yaml
        - ../../metrics-cases.yaml
        - ../../pvm-cases.yaml
        - ../../tracing-cases.yaml
