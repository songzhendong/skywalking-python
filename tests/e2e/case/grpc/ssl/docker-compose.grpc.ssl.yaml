services:

  # Ephemeral PEMs — not committed. Script: tests/e2e/script/prepare/gen-e2e-tls-certs.sh
  # Image: alpine/openssl (openssl preinstalled; digest-pinned; no apk).
  gen-certs:
    image: docker.io/alpine/openssl@sha256:80b347d7b4d58e28aae515cf808ba3ce1c4a2a69a323b2cb2cb2d6d278729684
    networks:
      - e2e
    volumes:
      - ../../../script/prepare/gen-e2e-tls-certs.sh:/scripts/gen-e2e-tls-certs.sh:ro
      - ./certs:/out/certs
      - ./ca:/out/ca
    entrypoint: ["/bin/sh"]
    command: ["/scripts/gen-e2e-tls-certs.sh", "ssl"]

  oap:
    extends:
      file: ../../../base/docker-compose.base.yml
      service: oap
    volumes:
      - ./certs:/skywalking/certs
    environment:
      SW_CORE_GRPC_SSL_ENABLED: "true"
      SW_CORE_GRPC_SSL_KEY_PATH: /skywalking/certs/server-key.pem
      SW_CORE_GRPC_SSL_CERT_CHAIN_PATH: /skywalking/certs/server.crt
      # Required whenever core gRPC SSL is on: OAP still builds a cluster-client
      # SSL context from this path (empty path crashes bootstrap). Not agent mTLS.
      SW_CORE_GRPC_SSL_TRUSTED_CA_PATH: /skywalking/certs/ca.crt
    depends_on:
      gen-certs:
        condition: service_completed_successfully
    ports:
      - "12800"

  provider:
    extends:
      file: ../../../base/docker-compose.base.yml
      service: fastapi-provider
    volumes:
      - ./ca:/certs
    environment:
      SW_AGENT_COLLECTOR_BACKEND_SERVICES: oap:11800
      SW_AGENT_SSL_TRUSTED_CA_PATH: /certs/ca.crt
    depends_on:
      gen-certs:
        condition: service_completed_successfully
      oap:
        condition: service_healthy
    ports:
      - "9090"

  consumer:
    extends:
      file: ../../../base/docker-compose.base.yml
      service: flask-consumer
    volumes:
      - ./ca:/certs
    environment:
      SW_AGENT_COLLECTOR_BACKEND_SERVICES: oap:11800
      SW_AGENT_SSL_TRUSTED_CA_PATH: /certs/ca.crt
    depends_on:
      provider:
        condition: service_healthy
    ports:
      - "9090"

networks:
  e2e:
