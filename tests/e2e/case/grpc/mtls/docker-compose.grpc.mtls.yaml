services:

  # Ephemeral PEMs — not committed. Script: tests/e2e/script/prepare/gen-e2e-tls-certs.sh
  # Image: alpine/openssl (openssl preinstalled; digest-pinned; no apk).
  gen-certs:
    image: docker.io/alpine/openssl@sha256:80b347d7b4d58e28aae515cf808ba3ce1c4a2a69a323b2cb2cb2d6d278729684
    networks:
      - e2e
    volumes:
      - ../../../script/prepare/gen-e2e-tls-certs.sh:/scripts/gen-e2e-tls-certs.sh:ro
      - ./server:/out/server
      - ./client:/out/client
    entrypoint: ["/bin/sh"]
    command: ["/scripts/gen-e2e-tls-certs.sh", "mtls"]

  oap:
    extends:
      file: ../../../base/docker-compose.base.yml
      service: oap
    volumes:
      - ./server:/skywalking/certs
    environment:
      # mTLS requires receiver-sharing-server.
      SW_RECEIVER_GRPC_PORT: 11811
      SW_RECEIVER_GRPC_SSL_ENABLED: "true"
      SW_RECEIVER_GRPC_SSL_KEY_PATH: /skywalking/certs/server.pem
      SW_RECEIVER_GRPC_SSL_CERT_CHAIN_PATH: /skywalking/certs/server.crt
      SW_RECEIVER_GRPC_SSL_TRUSTED_CAS_PATH: /skywalking/certs/ca.crt
    expose:
      - 11811
    depends_on:
      gen-certs:
        condition: service_completed_successfully
    # Probe the sharing-server mTLS port (not core 11800 from the base service).
    healthcheck:
      test: [ "CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/11811" ]
      interval: 5s
      timeout: 60s
      retries: 120
    ports:
      - "12800"

  provider:
    extends:
      file: ../../../base/docker-compose.base.yml
      service: fastapi-provider
    volumes:
      - ./client:/certs
    environment:
      SW_AGENT_COLLECTOR_BACKEND_SERVICES: oap:11811
      SW_AGENT_SSL_TRUSTED_CA_PATH: /certs/ca.crt
      SW_AGENT_SSL_KEY_PATH: /certs/client.pem
      SW_AGENT_SSL_CERT_CHAIN_PATH: /certs/client.crt
    depends_on:
      gen-certs:
        condition: service_completed_successfully
      oap:
        condition: service_healthy
    ports:
      - "9090"

  consumer:
    extends:
      file: ../../../base/docker-compose.base.yml
      service: flask-consumer
    volumes:
      - ./client:/certs
    environment:
      SW_AGENT_COLLECTOR_BACKEND_SERVICES: oap:11811
      SW_AGENT_SSL_TRUSTED_CA_PATH: /certs/ca.crt
      SW_AGENT_SSL_KEY_PATH: /certs/client.pem
      SW_AGENT_SSL_CERT_CHAIN_PATH: /certs/client.crt
    depends_on:
      provider:
        condition: service_healthy
    ports:
      - "9090"

networks:
  e2e:
