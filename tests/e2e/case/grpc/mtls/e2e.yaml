# gRPC mTLS against real OAP sharing server (Java simple/mtls parity).

setup:
  env: compose
  file: docker-compose.grpc.mtls.yaml
  timeout: 20m
  init-system-environment: ../../../script/env
  steps:
    - name: set PATH
      command: export PATH=/usr/local/bin:/tmp/skywalking-infra-e2e/bin:$PATH
    - name: install yq
      command: bash tests/e2e/script/prepare/install.sh yq
    - name: install swctl
      command: bash tests/e2e/script/prepare/install.sh swctl

trigger:
  action: http
  # Continuous traffic like Java simple/mtls (metrics need ongoing load).
  interval: 3s
  times: -1
  url: http://${consumer_host}:${consumer_9090}/artist-consumer
  method: POST
  headers:
    "Content-Type": "application/json"
  body: '{"song": "Despacito"}'

verify:
  retry:
    count: 20
    interval: 10s
  cases:
    # Java simple/mtls verify depth: full Python signal packs (grpc/single) +
    # java-parity extras (layer, consumer metadata, broader metrics, topology).
    - includes:
        - ../../logging-cases.yaml
        - ../../metadata-cases.yaml
        - ../../java-parity-cases.yaml
        - ../../metrics-cases.yaml
        - ../../pvm-cases.yaml
        - ../../tracing-cases.yaml
