# gRPC mTLS against real OAP sharing server (Java simple/mtls parity).

setup:
  env: compose
  file: docker-compose.grpc.mtls.yaml
  timeout: 20m
  init-system-environment: ../../../script/env
  steps:
    - name: install yq
      command: bash tests/e2e/script/prepare/install.sh yq
    - name: install swctl
      command: bash tests/e2e/script/prepare/install.sh swctl

trigger:
  action: http
  interval: 1s
  times: 10
  url: http://${consumer_host}:${consumer_9090}/artist-consumer
  method: POST
  headers:
    "Content-Type": "application/json"
  body: '{"song": "Despacito"}'

verify:
  retry:
    count: 20
    interval: 10s
  cases:
    # mTLS handshake coverage: service registration + traces/logs over secure gRPC.
    # metrics/pvm stay in grpc/single (need swctl/OAP GraphQL parity).
    - includes:
        - ../../logging-cases.yaml
        - ../../metadata-cases.yaml
        - ../../tracing-cases.yaml
