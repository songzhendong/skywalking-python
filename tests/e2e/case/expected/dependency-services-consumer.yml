# Pinned SW_CTL returns empty component lists; include [] so map compare matches.
nodes:
{{- contains .nodes }}
- id: {{ b64enc "User"}}.0
  name: User
  type: USER
  isreal: false
- id: {{ b64enc "e2e-service-consumer|namespace"}}.1
  name: "e2e-service-consumer|namespace"
  type: {{ notEmpty .type }}
  isreal: true
- id: {{ b64enc "e2e-service-provider"}}.1
  name: e2e-service-provider
  type: {{ notEmpty .type }}
  isreal: true
{{- end }}
calls:
{{- contains .calls }}
- source: {{ b64enc "e2e-service-consumer|namespace"}}.1
  sourcecomponents: []
  target: {{ b64enc "e2e-service-provider"}}.1
  targetcomponents: []
  id: {{ b64enc "e2e-service-consumer|namespace"}}.1-{{ b64enc "e2e-service-provider"}}.1
  detectpoints:
    {{- contains .detectpoints }}
    - {{ notEmpty . }}
    {{- end }}
- source: {{ b64enc "User" }}.0
  sourcecomponents: []
  target: {{ b64enc "e2e-service-consumer|namespace"}}.1
  targetcomponents: []
  id: {{ b64enc "User" }}.0-{{ b64enc "e2e-service-consumer|namespace"}}.1
  detectpoints:
    {{- contains .detectpoints }}
    - {{ notEmpty . }}
    {{- end }}
{{- end }}
