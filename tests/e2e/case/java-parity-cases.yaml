# Extra verify depth aligned with Java simple/ssl|mtls → simple-cases.yaml.
# Shared logging/metadata/metrics/pvm/tracing packs cover the Python baseline
# (grpc/single). This pack adds consumer-side metadata, service dependency
# topology, and broader service/endpoint metrics (same metrics linear API as
# metrics-cases.yaml; requires SW_CTL_COMMIT matching SW_OAP_COMMIT).

  cases:
    # layer list (Java simple-cases)
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql layer ls
      expected: expected/layer.yml

    # consumer metadata (Java checks provider + consumer)
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql endpoint list --service-name="e2e-service-consumer|namespace"
      expected: expected/service-endpoint-consumer.yml
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql instance list --service-name="e2e-service-consumer|namespace"
      expected: expected/service-instance-consumer.yml

    # service dependency topology (Java dependency service) — before metrics so
    # topology still verifies when metrics GraphQL and swctl are skewed.
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql dependency service --service-name=e2e-service-provider
      expected: expected/dependency-services-provider.yml
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql dependency service --service-name="e2e-service-consumer|namespace"
      expected: expected/dependency-services-consumer.yml

    # broader service metrics (Java: sla/cpm/resp_time on both sides)
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql metrics linear --name service_cpm --service-name=e2e-service-provider |yq e 'to_entries' -
      expected: expected/metrics-has-value.yml
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql metrics linear --name service_resp_time --service-name=e2e-service-provider |yq e 'to_entries' -
      expected: expected/metrics-has-value.yml
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql metrics linear --name service_sla --service-name="e2e-service-consumer|namespace" |yq e 'to_entries' -
      expected: expected/metrics-has-value.yml
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql metrics linear --name service_cpm --service-name="e2e-service-consumer|namespace" |yq e 'to_entries' -
      expected: expected/metrics-has-value.yml
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql metrics linear --name service_resp_time --service-name="e2e-service-consumer|namespace" |yq e 'to_entries' -
      expected: expected/metrics-has-value.yml

    # endpoint metrics on both sides
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql metrics linear --name endpoint_resp_time --endpoint-name=/artist-provider --service-name=e2e-service-provider |yq e 'to_entries' -
      expected: expected/metrics-has-value.yml
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql metrics linear --name endpoint_sla --endpoint-name=/artist-provider --service-name=e2e-service-provider |yq e 'to_entries' -
      expected: expected/metrics-has-value.yml
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql metrics linear --name endpoint_cpm --endpoint-name=/artist-consumer --service-name="e2e-service-consumer|namespace" |yq e 'to_entries' -
      expected: expected/metrics-has-value.yml
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql metrics linear --name endpoint_resp_time --endpoint-name=/artist-consumer --service-name="e2e-service-consumer|namespace" |yq e 'to_entries' -
      expected: expected/metrics-has-value.yml
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql metrics linear --name endpoint_sla --endpoint-name=/artist-consumer --service-name="e2e-service-consumer|namespace" |yq e 'to_entries' -
      expected: expected/metrics-has-value.yml
