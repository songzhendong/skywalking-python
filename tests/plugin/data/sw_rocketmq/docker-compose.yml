version: '2.1'

services:
  collector:
    extends:
      service: collector
      file: ../../docker-compose.base.yml

  namesrv:
    image: apache/rocketmq:4.9.4
    hostname: namesrv
    ports:
      - 9876:9876
    command: sh mqnamesrv
    networks:
      - beyond
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/9876"]
      interval: 5s
      timeout: 60s
      retries: 120

  broker:
    image: apache/rocketmq:4.9.4
    hostname: broker
    ports:
      - 10909:10909
      - 10911:10911
    environment:
      - NAMESRV_ADDR=namesrv:9876
    command: sh mqbroker -n namesrv:9876 autoCreateTopicEnable=true
    networks:
      - beyond
    depends_on:
      namesrv:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/10911"]
      interval: 5s
      timeout: 60s
      retries: 120

  producer:
    extends:
      service: agent
      file: ../../docker-compose.base.yml
    ports:
      - 9090:9090
    volumes:
      - .:/app
    command:
      [
        "bash",
        "-c",
        "pip install flask && pip install -r /app/requirements.txt && sw-python run python3 /app/services/producer.py",
      ]
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/9090"]
      interval: 5s
      timeout: 60s
      retries: 120
    depends_on:
      collector:
        condition: service_healthy
      broker:
        condition: service_healthy
      consumer:
        condition: service_healthy
    environment:
      SW_AGENT_NAME: producer
      SW_AGENT_LOGGING_LEVEL: DEBUG
      SW_AGENT_PVM_METER_REPORTER_ACTIVE: 'false'

  consumer:
    extends:
      service: agent
      file: ../../docker-compose.base.yml
    ports:
      - 9091:9091
    volumes:
      - .:/app
    command:
      [
        "bash",
        "-c",
        "pip install -r /app/requirements.txt && sw-python run python3 /app/services/consumer.py",
      ]
    healthcheck:
      test: ["CMD", "bash", "-c", "test -f /tmp/consumer_ready"]
      interval: 5s
      timeout: 60s
      retries: 120
    depends_on:
      collector:
        condition: service_healthy
      broker:
        condition: service_healthy
    environment:
      SW_AGENT_NAME: consumer
      SW_AGENT_LOGGING_LEVEL: DEBUG
      SW_AGENT_PVM_METER_REPORTER_ACTIVE: 'false'

networks:
  beyond:
